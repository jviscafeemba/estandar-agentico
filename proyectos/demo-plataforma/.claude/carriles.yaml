# Carriles de demo-plataforma (E7). Lo lee el hook carril de emba-harness cuando la sesión define EMBA_CARRIL.
# "x/" = esa carpeta y todo lo de adentro. "nunca" gana sobre "escribe". El contrato compartido (contratos/)
# tiene UN dueño: el carril B. Los archivos de la raíz, docs/ y .claude/ no son de ningún carril: los cambia el líder.
A:
  escribe:
    - modulos/ventas/
    - tests/ventas/
  nunca:
    - contratos/
    - tests/contratos/
B:
  escribe:
    - modulos/stock/
    - tests/stock/
    - contratos/         # dueño del contrato de eventos
    - tests/contratos/
C:
  escribe:
    - modulos/reportes/
    - tests/reportes/
  nunca:
    - contratos/
    - tests/contratos/
