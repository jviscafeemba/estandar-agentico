# Carriles de demo-plataforma para la simulación de conjunto (paso 6): los tres de E7 más D (integración con el ERP).
# "x/" = esa carpeta y todo lo de adentro. "nunca" gana sobre "escribe". El contrato compartido (contratos/)
# tiene UN dueño: el carril B. docs/cambios/ (las propuestas del flujo) lo escriben todos: cada propuesta es un
# archivo propio. El resto de docs/, la raíz y .claude/ no son de ningún carril: los cambia el líder.
A:
  escribe:
    - modulos/ventas/
    - tests/ventas/
    - docs/cambios/
  nunca:
    - contratos/
    - tests/contratos/
B:
  escribe:
    - modulos/stock/
    - tests/stock/
    - contratos/         # dueño del contrato de eventos
    - tests/contratos/
    - docs/cambios/
C:
  escribe:
    - modulos/reportes/
    - tests/reportes/
    - docs/cambios/
  nunca:
    - contratos/
    - tests/contratos/
D:
  escribe:
    - modulos/erp/
    - tests/erp/
    - docs/cambios/
  nunca:
    - contratos/
    - tests/contratos/
